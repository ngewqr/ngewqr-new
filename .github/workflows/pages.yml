# Deploys ONLY the public ngewqr.com site to GitHub Pages.
# portal/ and worker/ are excluded: the Chartroom portal is served by a
# Cloudflare Worker behind Cloudflare Access, never from GitHub Pages.
# Requires: repo Settings → Pages → Source = "GitHub Actions".
#
# Build and deploy are separate jobs (GitHub's recommended layout): the deploy
# job starts only after the build job has finished, so the uploaded artifact
# is always listed by the time deploy-pages looks for it.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site
        run: |
          mkdir _site
          cp index.html 404.html style.css script.js favicon.svg apple-touch-icon.png robots.txt CNAME .nojekyll _site/
          cp -r img fonts _site/
          test ! -e _site/portal && test ! -e _site/worker
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
