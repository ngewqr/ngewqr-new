# Deploys ONLY the public ngewqr.com site to GitHub Pages.
# portal/ and worker/ are excluded: the TA portal is served from Cloudflare
# Pages behind Cloudflare Access, never from GitHub Pages.
# Requires: repo Settings → Pages → Source = "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site
        run: |
          mkdir _site
          cp index.html 404.html style.css script.js favicon.svg apple-touch-icon.png robots.txt CNAME .nojekyll _site/
          cp -r img fonts _site/
          test ! -e _site/portal && test ! -e _site/worker
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
