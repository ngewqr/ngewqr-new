name = "ta-portal"
main = "src/index.js"
compatibility_date = "2025-06-01"

# One Worker serves the portal's static files and the /api/* Yahoo proxy on
# ta.ngewqr.com, which is covered by the "TA Portal" Cloudflare Access app.
# Never expose it on *.workers.dev: that URL is not behind Access.
workers_dev = false
preview_urls = false
routes = [{ pattern = "ta.ngewqr.com", custom_domain = true }]

[assets]
directory = "../portal"
binding = "ASSETS"

# Secrets (wrangler secret put <NAME>; never committed):
#   ACCESS_TEAM_DOMAIN   Zero Trust team domain (<team>.cloudflareaccess.com)
#   ACCESS_AUD           AUD tag of the "TA Portal" Access application
# Local dev only, in .dev.vars (gitignored): DEV_BYPASS_ACCESS = "true"
